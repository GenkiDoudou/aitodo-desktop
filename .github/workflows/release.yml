# 公开仓发版：打 v* tag 后打包，并上传到 GitHub Releases
# 桌面端自动更新仅从 GitHub 拉取

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*-win.zip
            dist/*.zip
            dist/*.part*
          body: |
            ## 下载说明
            - **安装版**：下载 `小柒todo Setup *.exe`
            - **免解压版**：下载完整 `*-win.zip` 解压即可（数据目录默认在 exe 同级 `data/`）
            - 客户端自动更新仅从本 GitHub Release 读取 `latest.yml` / `latest-portable.yml`
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 失败时删掉本次 GitHub Release+tag，便于本机重新推同名 tag 重跑
      - name: Cleanup Release and tag on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set +e
          echo "[cleanup] tag=$RELEASE_TAG"
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "[cleanup] done (exit=$?)"
          exit 0
